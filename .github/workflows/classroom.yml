name: Autograding Tests

on:
  push:
  repository_dispatch:

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: testBinTreeInsert
        id: test-bintree-insert
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: testBinTreeInsert
          setup-command: ''
          command: ./gradlew test --tests at.ac.hcw.bintree.BinTreeTest.insertCreatesRootNode --tests at.ac.hcw.bintree.BinTreeTest.insertPlacesSmallerKeysLeftAndGreaterKeysRight
          timeout: 1
          max-score: 1

      - name: testBinTreeLookup
        id: test-bintree-lookup
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: testBinTreeLookup
          setup-command: ''
          command: ./gradlew test --tests at.ac.hcw.bintree.BinTreeTest.duplicateKeyUpdatesDataWithoutIncreasingNodeCount --tests at.ac.hcw.bintree.BinTreeTest.lookupReturnsStoredDataForExistingKey --tests at.ac.hcw.bintree.BinTreeTest.lookupReturnsNullForMissingKey
          timeout: 1
          max-score: 1

      - name: testAvlCountAndSimpleRotations
        id: test-avl-count-and-simple-rotations
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: testAvlCountAndSimpleRotations
          setup-command: ''
          command: ./gradlew test --tests at.ac.hcw.bintree.AvlTreeTest.insertCountsNodesInAvlTree --tests at.ac.hcw.bintree.AvlTreeTest.rightRotationBalancesLeftLeftCase --tests at.ac.hcw.bintree.AvlTreeTest.leftRotationBalancesRightRightCase
          timeout: 1
          max-score: 1

      - name: testAvlDoubleRotations
        id: test-avl-double-rotations
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: testAvlDoubleRotations
          setup-command: ''
          command: ./gradlew test --tests at.ac.hcw.bintree.AvlTreeTest.leftRightRotationBalancesLeftRightCase --tests at.ac.hcw.bintree.AvlTreeTest.rightLeftRotationBalancesRightLeftCase
          timeout: 1
          max-score: 1

      - name: testAvlComplexDoubleRotation
        id: test-avl-complex-double-rotation
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: testAvlComplexDoubleRotation
          setup-command: ''
          command: ./gradlew test --tests at.ac.hcw.bintree.AvlTreeTest.leftRightRotationPreservesGrandchildrenSubtrees
          timeout: 1
          max-score: 1

      - name: Autograding Reporter
        if: always()
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          TEST-BINTREE-INSERT_RESULTS: "${{steps.test-bintree-insert.outputs.result}}"
          TEST-BINTREE-LOOKUP_RESULTS: "${{steps.test-bintree-lookup.outputs.result}}"
          TEST-AVL-COUNT-AND-SIMPLE-ROTATIONS_RESULTS: "${{steps.test-avl-count-and-simple-rotations.outputs.result}}"
          TEST-AVL-DOUBLE-ROTATIONS_RESULTS: "${{steps.test-avl-double-rotations.outputs.result}}"
          TEST-AVL-COMPLEX-DOUBLE-ROTATION_RESULTS: "${{steps.test-avl-complex-double-rotation.outputs.result}}"
        with:
          runners: test-bintree-insert,test-bintree-lookup,test-avl-count-and-simple-rotations,test-avl-double-rotations,test-avl-complex-double-rotation
